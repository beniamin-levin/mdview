<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Scripts only from the app bundle; nothing inside a markdown file can run code or make requests. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src 'unsafe-inline'; img-src file: data: https: http:; media-src file: https:; font-src file:">
<base id="base" href="">
<style>
:root { color-scheme: light dark; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --code:#f6f8fa; --link:#0969da; --bg:#ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e6edf3; --muted:#9198a1; --border:#3d444d; --code:#151b23; --link:#4493f8; --bg:#0d1117; }
}
html { background: var(--bg); }
body { margin: 0 auto; max-width: 860px; padding: 32px 40px 80px; color: var(--fg);
       font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; word-wrap: break-word; }
h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 .6em; line-height: 1.25; font-weight: 600; }
h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.25em; }
#content > :first-child { margin-top: 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
p, ul, ol, blockquote, pre, table { margin: 0 0 1em; }
ul, ol { padding-left: 2em; }
li + li { margin-top: .25em; }
li > input[type=checkbox] { margin: 0 .4em 0 -1.4em; vertical-align: middle; }
li:has(> input[type=checkbox]) { list-style: none; }
blockquote { padding: 0 1em; color: var(--muted); border-left: .25em solid var(--border); }
code, pre { font: 85% ui-monospace, SFMono-Regular, Menlo, monospace; }
code { background: var(--code); padding: .2em .4em; border-radius: 6px; }
pre { background: var(--code); padding: 16px; border-radius: 6px; overflow: auto; line-height: 1.45; }
pre code { background: none; padding: 0; font-size: 100%; }
table { border-collapse: collapse; display: block; overflow: auto; }
th, td { border: 1px solid var(--border); padding: 6px 13px; }
th { font-weight: 600; }
tr:nth-child(2n) { background: var(--code); }
img { max-width: 100%; }
hr { height: .25em; border: 0; background: var(--border); margin: 24px 0; }
</style>
</head>
<body>
<div id="content"></div>
<script src="marked.umd.js"></script>
<script src="render.js"></script>
</body>
</html>
